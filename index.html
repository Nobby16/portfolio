<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e6eef7" />
    <meta name="description" content="Kidus Admassu — Information Systems graduate focused on IT, cybersecurity, and practical systems." />
    <title>Kidus Admassu | Portfolio</title>
    <script>
      (() => {
        const THEME_COLORS = { light: '#e6eef7', dark: '#0b1220' }
        let theme
        try {
          theme = localStorage.getItem('portfolio-theme')
        } catch {
          theme = null
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', THEME_COLORS[theme] || THEME_COLORS.light)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
